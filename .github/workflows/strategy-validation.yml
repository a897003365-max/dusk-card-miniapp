name: Strategy validation
on:
  push:
    branches: [main, feat/street-strategy-v2]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/strategy-tests.log"
      - name: WXSS static checks (native acceptance runs in WeChat DevTools)
        if: always()
        run: node tests/claw-wxss.test.js 2>&1 | tee "$RUNNER_TEMP/strategy-wxss.log"
      - name: Package budgets
        if: always()
        run: node scripts/check-package-budget.js 2>&1 | tee "$RUNNER_TEMP/strategy-budget.log"
      - name: Export inspected source for implementation
        if: always()
        run: tar --exclude='./.git' --exclude='./docs' --exclude='./node_modules' -czf "$RUNNER_TEMP/strategy-source.tar.gz" . docs/combat-motion/legacy-casts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-validation
          path: |
            ${{ runner.temp }}/strategy-source.tar.gz
            ${{ runner.temp }}/strategy-*.log
          retention-days: 3
