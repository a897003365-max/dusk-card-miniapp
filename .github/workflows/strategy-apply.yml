name: Apply verified street strategy changes
on:
  push:
    branches: [feat/street-strategy-v2]
    paths: ['.github/strategy-transfer/**']
permissions: {}
concurrency:
  group: street-strategy-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'a897003365-max/dusk-card-miniapp' && github.ref == 'refs/heads/feat/street-strategy-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify base and patch checksum
        run: |
          test "$(git rev-parse HEAD^)" = "501488e792936265101997bd98df418450f15f0b"
          python3 - <<'PY'
          import pathlib, lzma, hashlib, os
          packed = b''.join(pathlib.Path(f'.github/strategy-transfer/part-{i}.xz').read_bytes() for i in (1, 2, 3))
          raw = lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest() == '91189279711d07f5e9fed1248fb20883bf2587af67a61dd03a14737d4db26ee1'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'strategy-series.mbox').write_bytes(raw)
          PY
      - name: Apply verified commits
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git am "$RUNNER_TEMP/strategy-series.mbox"
      - name: Validate unit and integration tests
        run: npm test
      - name: Validate static styles and package budgets
        run: |
          node tests/claw-wxss.test.js
          node scripts/check-package-budget.js
          git diff --check
      - name: Commit payload cleanup and push the feature branch
        run: |
          git rm .github/strategy-transfer/part-{1,2,3}.xz
          git commit -m "chore: remove verified transfer payload"
          git push origin HEAD:refs/heads/feat/street-strategy-v2
